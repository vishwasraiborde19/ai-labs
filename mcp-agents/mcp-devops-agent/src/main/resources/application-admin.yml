# Activate with --spring.profiles.active=admin (or http,admin) to serve the admin UI at /admin.
# Admin-only mode refuses MCP over HTTP unless devops.http.auth-token-ref is set.
spring:
  main:
    web-application-type: servlet
  ai:
    mcp:
      server:
        stdio: false
        protocol: STREAMABLE

server:
  address: ${DEVOPS_AGENT_HOST:127.0.0.1}
  port: ${DEVOPS_AGENT_PORT:8766}
