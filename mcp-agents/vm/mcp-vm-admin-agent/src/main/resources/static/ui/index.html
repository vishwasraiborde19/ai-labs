<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VM Control Centre</title>
<link rel="stylesheet" href="/webjars/xterm/5.3.0/css/xterm.css">
<link rel="stylesheet" href="/ui/app.css">
<script src="/webjars/xterm/5.3.0/lib/xterm.js" defer></script>
<script src="/webjars/xterm-addon-fit/0.8.0/lib/xterm-addon-fit.js" defer></script>
<script src="/ui/app.js" defer></script>
<script src="/ui/features.js" defer></script>
</head>
<body>
<header class="top">
  <button class="icon menu" id="menu" aria-label="Show hosts">&#9776;</button>
  <h1>VM Control Centre</h1>
  <nav class="views" id="views">
    <button data-view="fleet" class="on">Fleet</button>
    <button data-view="broadcast">Broadcast</button>
    <button data-view="sync">Sync</button>
    <button data-view="schedules">Schedules</button>
    <button data-view="alerts">Alerts <span class="badge" id="alert-count" hidden></span></button>
    <button data-view="audit">Audit</button>
  </nav>
  <span class="spacer"></span>
  <span class="mode" id="mode">Local access, no sign-in</span>
</header>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-head">
      <input type="search" id="filter" placeholder="Filter hosts" aria-label="Filter hosts">
    </div>
    <ul class="hostlist" id="hostlist"></ul>
    <div class="side-foot"><button class="primary wide" id="add-host">Add host</button></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
</body>
</html>
