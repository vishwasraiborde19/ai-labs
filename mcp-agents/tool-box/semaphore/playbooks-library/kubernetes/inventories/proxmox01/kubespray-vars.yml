# Passed to kubespray with -e (highest precedence), as cluster-variable.yaml was on the installer VM.
# Everything else is kubespray v2.23.0's inventory/sample/group_vars, unchanged.
kube_version: v1.27.5
helm_enabled: true
kube_proxy_mode: iptables

# containerd registries. This replaces kubespray's default list, so docker.io is repeated as-is.
# Harbor (192.168.1.173) serves plain HTTP: the http:// endpoint makes containerd pull without TLS.
# Image names stay "192.168.1.173/<project>/<image>:<tag>"; credentials come from imagePullSecrets.
# Apply: Semaphore "Kubespray: deploy / converge" with CLI args --tags=containerd (restarts containerd;
# running pods keep running). Try one node first: --tags=containerd --limit=kube-node-001
containerd_registries_mirrors:
  - prefix: docker.io
    mirrors:
      - host: https://registry-1.docker.io
        capabilities: ["pull", "resolve"]
        skip_verify: false
  - prefix: 192.168.1.173
    mirrors:
      - host: http://192.168.1.173
        capabilities: ["pull", "resolve"]
