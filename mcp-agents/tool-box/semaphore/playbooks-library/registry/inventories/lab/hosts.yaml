# Lab services that are not Kubernetes nodes. Kept apart from kubernetes/inventories/proxmox01 so kubespray
# never touches them. Semaphore inventory "registry" (file) points here.
all:
  children:
    harbor:
      hosts:
        harbor-server:
          ansible_host: 192.168.1.173
          harbor_data_device: /dev/sdb        # blank 60G disk -> /data (root disk is only 31G)
