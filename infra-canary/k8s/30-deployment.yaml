apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-canary
  namespace: infra-canary
  labels:
    app: infra-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-canary
  strategy:
    type: Recreate          # the log volume is ReadWriteOnce: the old pod must release it first
  template:
    metadata:
      labels:
        app: infra-canary
      annotations:              # for a Prometheus that discovers pods by annotation
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001          # Longhorn volume is chowned to this group on mount, so the app can write
      imagePullSecrets:
      - name: harbor-pull     # robot account with pull on Harbor project "infracanary" (tool-box/harbour/runbook.md)
      containers:
      - name: infra-canary
        image: vishwasraiborde19/infra-canary-img
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: infra-canary
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        # Written out (these are the defaults) because the chaos console tests them: readiness drops the pod
        # from Service 40 after 3 x 5s; liveness restarts the container after 3 x 10s; 1s timeout each.
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - name: logs
          mountPath: /app/logs/canary
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: infra-canary-logs
