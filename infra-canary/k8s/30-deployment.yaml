apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-canary
  namespace: infra-canary
  labels:
    app: infra-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-canary
  strategy:
    type: Recreate          # the log volume is ReadWriteOnce: the old pod must release it first
  template:
    metadata:
      labels:
        app: infra-canary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001          # Longhorn volume is chowned to this group on mount, so the app can write
      imagePullSecrets:
      - name: harbor-pull     # robot account with pull on Harbor project "infracanary" (tool-box/harbour/runbook.md)
      containers:
      - name: infra-canary
        image: 192.168.1.173/infracanary/infra-canary:0.1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: infra-canary
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          initialDelaySeconds: 10
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          initialDelaySeconds: 30
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - name: logs
          mountPath: /app/logs/canary
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: infra-canary-logs
