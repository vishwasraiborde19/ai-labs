spring.application.name=infra-canary
server.port=8080
management.endpoints.web.exposure.include=health,info,loggers
management.endpoint.health.probes.enabled=true
heartbeat.interval=30s
# logging.file.name: /app/logs/canary/infra-canary.log in the image (LOGGING_FILE_NAME) and the ConfigMap,
# where /app/logs/canary is the Longhorn volume. canary.http-targets is set in the ConfigMap.
canary.dns-name=kubernetes.default.svc.cluster.local
canary.http-targets=
