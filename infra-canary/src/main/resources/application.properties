spring.application.name=infra-canary
server.port=8080
management.endpoints.web.exposure.include=health,info,loggers,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
heartbeat.interval=30s
# logging.file.name: /app/logs/canary/infra-canary.log in the image (LOGGING_FILE_NAME) and the ConfigMap,
# where /app/logs/canary is the Longhorn volume. canary.http-targets is set in the ConfigMap.
canary.dns-name=kubernetes.default.svc.cluster.local
canary.http-targets=

# Chaos console (UI at /, API under /chaos). Off unless enabled: it can break this pod on purpose.
# canary.chaos.token: when set, every change needs header X-Chaos-Token (the UI has a field for it).
canary.chaos.enabled=false
canary.chaos.token=
# Show ResponseStatusException reasons (e.g. why a chaos change was refused) in error bodies
server.error.include-message=always
